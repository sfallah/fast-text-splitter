[package]
name = "fast-text-splitter"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "fast_text_splitter"
#crate-type = ["cdylib"]

[dependencies]
tokenizers = { version = "0.21.1", features = ["http", "onig", "esaxx_fast"] }
aho-corasick = "=1.1.3"
anyhow = "1.0.97"
rayon = "1.10.0"
pyo3 = { version = "0.22.6", optional = true, features = ["extension-module"] }
pyo3-macros-backend = { version = "0.22.6", optional = true }
once_cell = "1.9"
memchr = "2.7.2"
unicode-normalization = "0.1.23"
unicode_categories = "0.1.1"
serde = { version = "1.0.197", features = ["derive"] }
itertools = "0.14.0"
rand = "0.9.2"
termtree = "0.5.1"
punkt = { git = "https://gitlab.com/qimiaio/qimia-ai-dev/rust-punkt.git", branch = "feat/sentence_splitter" }
icu_segmenter = "2.0.0"
tiktoken-rs = "0.7.0"
kitoken = "=0.10.1"
regex = "1.11.1"

[features]
default = []
py-binding = ["pyo3", "pyo3-macros-backend"]

[dev-dependencies]
criterion = "0.7.0"
memchr = "2.7.2"
tempfile = "3.2.0"

[profile.release]

codegen-units = 1
debug = false
debug-assertions = false
incremental = false
lto = "fat"
opt-level = 's'
overflow-checks = false
panic = "abort"
strip = "symbols"

[profile.release.build-override]

opt-level = 's'

[profile.performance]

inherits = "release"
opt-level = 3

[profile.performance.build-override]

opt-level = 3

[profile.bench]

inherits = "release"
opt-level = 3
debug = true
strip = "none"

[profile.bench.build-override]

opt-level = 3

[profile.test]

inherits = "dev"
opt-level = 1

[[bench]]
name = "benchmarks"
harness = false
