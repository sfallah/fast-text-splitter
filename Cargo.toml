[package]
name = "fast-text-splitter"
version = "0.1.0"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[lib]
name = "fast_text_splitter"
#crate-type = ["cdylib"]

[dependencies]
tokenizers = { version = "0.21.1", features = ["http", "onig", "esaxx_fast"] }
aho-corasick = "=1.1.3"
anyhow = "1.0.97"
rayon = "1.10.0"
pyo3 = { version = "0.22.6", optional = true, features = ["extension-module"] }
pyo3-macros-backend = { version = "0.22.6", optional = true }
memchr = "2.7.2"
unicode-normalization = "0.1.23"
unicode_categories = "0.1.1"
serde = { version = "1.0.197", features = ["derive"] }
termtree = "0.5.1"
sentence-splitter = { git = "https://github.com/sfallah/sentence-splitter.git", branch = "main" }

[features]
default = []
py-binding = ["pyo3", "pyo3-macros-backend"]

[dev-dependencies]
criterion = "0.8.2"
# 0.9 so it unifies with the rand that tokenizers/hf-hub already pull
rand = "0.9"
# tokenizer speed comparisons in benches/ and the kitoken equivalence test
kitoken = "0.11.0"
tiktoken-rs = "0.12.0"
# resolves tokenizer.json from the hf-hub cache for loaders that only read files
hf-hub = { version = "0.4", features = ["ureq"] }
memchr = "2.7.2"
tempfile = "3.2.0"

[profile.release]

codegen-units = 1
debug = false
debug-assertions = false
incremental = false
lto = "fat"
opt-level = 's'
overflow-checks = false
panic = "abort"
strip = "symbols"

[profile.release.build-override]

opt-level = 's'

[profile.performance]

inherits = "release"
opt-level = 3

[profile.performance.build-override]

opt-level = 3

[profile.bench]

inherits = "release"
opt-level = 3
debug = true
strip = "none"

[profile.bench.build-override]

opt-level = 3

[profile.test]

inherits = "dev"
opt-level = 1

[[bench]]
name = "benchmarks"
harness = false
